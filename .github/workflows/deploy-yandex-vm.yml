name: Deploy to Yandex VM

on:
  workflow_dispatch:
    inputs:
      compose_profiles:
        description: "Compose profiles to enable on the VM"
        required: true
        default: "telegram nlu"
      smoke_url:
        description: "Health URL reachable from the VM"
        required: true
        default: "http://127.0.0.1:8089/actuator/health"

permissions:
  contents: read

concurrency:
  group: astor-yandex-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard tracked secrets and artifacts
        run: |
          set -euo pipefail
          tracked="$(git ls-files '.env' '.env.*' 'target/**' '.codex*' || true)"
          if [ -n "$tracked" ]; then
            echo "Forbidden tracked files detected:"
            echo "$tracked"
            exit 1
          fi

      - name: Prepare SSH
        env:
          YANDEX_VM_SSH_KEY: ${{ secrets.YANDEX_VM_SSH_KEY }}
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
          YANDEX_VM_SSH_PORT: ${{ secrets.YANDEX_VM_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$YANDEX_VM_SSH_KEY" > ~/.ssh/yandex_vm_key
          chmod 600 ~/.ssh/yandex_vm_key
          ssh-keyscan -p "${YANDEX_VM_SSH_PORT:-22}" "$YANDEX_VM_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to VM
        env:
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
          YANDEX_VM_USER: ${{ secrets.YANDEX_VM_USER }}
          YANDEX_VM_SSH_PORT: ${{ secrets.YANDEX_VM_SSH_PORT }}
          YANDEX_VM_DEPLOY_PATH: ${{ secrets.YANDEX_VM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          deploy_path="${YANDEX_VM_DEPLOY_PATH:-/opt/astor-butler}"
          ssh -i ~/.ssh/yandex_vm_key -p "${YANDEX_VM_SSH_PORT:-22}" \
            "$YANDEX_VM_USER@$YANDEX_VM_HOST" "mkdir -p '$deploy_path'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'target/' \
            --exclude '.codex/' \
            --exclude '.codex*/' \
            -e "ssh -i ~/.ssh/yandex_vm_key -p ${YANDEX_VM_SSH_PORT:-22}" \
            ./ "$YANDEX_VM_USER@$YANDEX_VM_HOST:$deploy_path/"

      - name: Compose up on VM
        env:
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
          YANDEX_VM_USER: ${{ secrets.YANDEX_VM_USER }}
          YANDEX_VM_SSH_PORT: ${{ secrets.YANDEX_VM_SSH_PORT }}
          YANDEX_VM_DEPLOY_PATH: ${{ secrets.YANDEX_VM_DEPLOY_PATH }}
          COMPOSE_PROFILES: ${{ inputs.compose_profiles }}
          SMOKE_URL: ${{ inputs.smoke_url }}
        run: |
          set -euo pipefail
          deploy_path="${YANDEX_VM_DEPLOY_PATH:-/opt/astor-butler}"
          profile_args=""
          for profile in $COMPOSE_PROFILES; do
            profile_args="$profile_args --profile $profile"
          done
          ssh -i ~/.ssh/yandex_vm_key -p "${YANDEX_VM_SSH_PORT:-22}" \
            "$YANDEX_VM_USER@$YANDEX_VM_HOST" \
            "set -euo pipefail
             cd '$deploy_path'
             test -f .env.production
             docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml $profile_args up -d --build
             docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml $profile_args ps
             curl -fsS '$SMOKE_URL'"
